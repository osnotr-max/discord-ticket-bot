[package]
name = "ticket-bot"
version = "0.2.0"
edition = "2021"
description = "Multi-type Discord ticket bot in Rust, in-memory, English UI, with rating+feedback and open-ticket reminders."

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"

[dependencies]
serenity = { version = "0.12.4", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "cache",
    "http",
    "utils",
    "rustls_backend",
    "chrono",
] }
tokio = { version = "1.43.0", features = ["full"] }
dashmap = "6.1.0"
chrono = { version = "0.4.39", features = ["serde"] }
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
async-trait = "0.1"
